name: royal_marble
description: An app that would track the live location of workers.

version: 10.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  google_maps_flutter: ^2.5.0
  provider: ^6.1.1
  country_picker: ^2.0.20
  email_validator: ^3.0.0
  cupertino_icons: ^2.0.0
  url_launcher: ^6.1.14
  geolocator: ^14.1.1
  permission_handler: ^13.0.2
  geocoding: ^5.0.0
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  flutter_background_geolocation: ^4.18.3
  intl: ^0.20.3
  pdf: ^3.10.4
  printing: ^5.11.1
  intl_phone_number_input: ^0.7.3+1
  path_provider: ^2.1.1
  open_filex: ^4.3.4
  syncfusion_flutter_xlsio: ^35.1.37
  connectivity_plus: ^7.3.1
  firebase_crashlytics: ^5.4.0
 

